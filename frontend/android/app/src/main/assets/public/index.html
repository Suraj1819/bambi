    <script>
      (function () {
        try {
          var stored = localStorage.getItem('webdrop-theme');

          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia(
                  '(prefers-color-scheme: light)'
                ).matches
                ? 'light'
                : 'dark';

          document.documentElement.classList.toggle(
            'dark',
            theme === 'dark'
          );

          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
